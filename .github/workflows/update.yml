name: Aktualizace statistik

on:
  schedule:
    # Víc časů mimo celé hodiny: GitHub plánované běhy často zdrží nebo vynechá, další je pak doběhne.
    # UTC; v zimním čase +1 h, v letním +2 h (6:17 UTC = 7:17 v zimě).
    - cron: "17 5 * * *"
    - cron: "47 6 * * *"
    - cron: "23 9 * * *"
    - cron: "11 12 * * *"
    - cron: "37 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "page.html"
      - "build.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stažení dat a sestavení stránky
        run: python build.py

      - name: Uložení nových dat do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site cache
          if git diff --cached --quiet; then
            echo "Žádná nová data."
          else
            git commit -m "Aktualizace dat $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
