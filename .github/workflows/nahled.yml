name: Náhled dat (bez zveřejnění)

on:
  push:
    branches: [nahled]

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sonda API
        if: hashFiles('probe.py') != ''
        run: python probe.py
      - name: Sestavení dat
        if: hashFiles('probe.py') == ''
        run: python build.py
      - name: Uložení do větve náhledu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site cache
          git diff --cached --quiet || git commit -m "Náhled dat $(date -u +%Y-%m-%dT%H:%M)"
          git push
